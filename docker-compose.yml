services:

  backend:
    build: ./backend
    container_name: mern-backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/mern_dashboard
      JWT_SECRET: my_super_secret_jwt_key_123456

    depends_on:
      - mongo

    restart: unless-stopped


  mongo:
    image: mongo:6.0
    container_name: mern-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: mern-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  mongo_data: